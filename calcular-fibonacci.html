<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora Fibonacci | Proyectofila2</title>
    <link rel="stylesheet" href="estilos.css">
</head>
<body>
    <header class="encabezado">
        <h1>Generador de Fibonacci</h1>
        <p>Genera los términos de la sucesión</p>
    </header>

    <nav class="navegacion">
        <a href="index.html">Inicio</a>
        <a href="ecuaciones2x2.html">Ecuaciones 2x2</a>
        <a href="ecuaciones3x3.html">Ecuaciones 3x3</a>
        <a href="fibonacci.html">Explicación Fibonacci</a>
        <a href="collatz.html">Collatz</a>
    </nav>

    <main class="contenedor">
        <section class="calculadora">
            <h2>¿Cuántos términos deseas generar?</h2>

            <form id="formulario">
                <div class="campo">
                    <label for="cantidad">Cantidad de términos (1 a 100)</label>
                    <input type="number" id="cantidad" min="1" max="100"
                           value="10" step="1" required>
                </div>

                <button class="boton" type="submit">Generar sucesión</button>
            </form>

            <div id="resultado" class="resultado" aria-live="polite"></div>
            <a class="boton" href="fibonacci.html">Volver a la explicación</a>
        </section>
    </main>

    <footer class="pie"><p>Proyectofila2</p></footer>

    <script>
        const formulario = document.getElementById("formulario");
        const resultado = document.getElementById("resultado");

        formulario.addEventListener("submit", function(evento) {
            evento.preventDefault();

            const cantidad = Number(document.getElementById("cantidad").value);

            if (!Number.isInteger(cantidad) || cantidad < 1 || cantidad > 100) {
                resultado.style.display = "block";
                resultado.textContent = "Ingresa un número entero entre 1 y 100.";
                return;
            }

            const numeros = [];

            for (let i = 0; i < cantidad; i++) {
                if (i === 0) {
                    numeros.push(0);
                } else if (i === 1) {
                    numeros.push(1);
                } else {
                    numeros.push(numeros[i - 1] + numeros[i - 2]);
                }
            }

            let pasos = "";

            for (let i = 0; i < numeros.length; i++) {
                if (i === 0) {
                    pasos += `<li>F(1) = 0</li>`;
                } else if (i === 1) {
                    pasos += `<li>F(2) = 1</li>`;
                } else {
                    pasos += `<li>F(${i + 1}) = ${numeros[i - 1]} + ${numeros[i - 2]} = ${numeros[i]}</li>`;
                }
            }

            resultado.style.display = "block";
            resultado.innerHTML = `
                <h3>Sucesión generada</h3>
                <p>${numeros.join(", ")}</p>
                <h3>Cálculo de cada término</h3>
                <ol class="lista">${pasos}</ol>
            `;
        });
    </script>
</body>
</html>
