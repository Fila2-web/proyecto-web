<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora 3x3 | Proyectofila2</title>
    <link rel="stylesheet" href="estilos.css">
</head>
<body>
    <header class="encabezado">
        <h1>Calculadora de ecuaciones 3x3</h1>
        <p>Resuelve un sistema de tres ecuaciones</p>
    </header>

    <nav class="navegacion">
        <a href="index.html">Inicio</a>
        <a href="ecuaciones2x2.html">Ecuaciones 2x2</a>
        <a href="ecuaciones3x3.html">Explicación 3x3</a>
        <a href="fibonacci.html">Fibonacci</a>
        <a href="collatz.html">Collatz</a>
        <a href="formulario.html">Administrador</a>
    </nav>

    <main class="contenedor">
        <section class="calculadora">
            <h2>Ingresa los coeficientes</h2>
            <p>Completa los valores de las tres ecuaciones.</p>

            <form id="formulario">
                <div class="campo">
                    <label for="e1">Ecuación 1: ax + by + cz = d</label>
                    <div class="grupo-campos">
                        <input aria-label="Coeficiente x de ecuación 1" id="a1" type="number" step="any" value="1" required>
                        <input aria-label="Coeficiente y de ecuación 1" id="b1" type="number" step="any" value="1" required>
                        <input aria-label="Coeficiente z de ecuación 1" id="c1" type="number" step="any" value="1" required>
                        <input aria-label="Resultado de ecuación 1" id="d1" type="number" step="any" value="6" required>
                    </div>
                </div>

                <div class="campo">
                    <label for="e2">Ecuación 2: ex + fy + gz = h</label>
                    <div class="grupo-campos">
                        <input aria-label="Coeficiente x de ecuación 2" id="a2" type="number" step="any" value="2" required>
                        <input aria-label="Coeficiente y de ecuación 2" id="b2" type="number" step="any" value="1" required>
                        <input aria-label="Coeficiente z de ecuación 2" id="c2" type="number" step="any" value="-1" required>
                        <input aria-label="Resultado de ecuación 2" id="d2" type="number" step="any" value="1" required>
                    </div>
                </div>

                <div class="campo">
                    <label for="e3">Ecuación 3: ix + jy + kz = l</label>
                    <div class="grupo-campos">
                        <input aria-label="Coeficiente x de ecuación 3" id="a3" type="number" step="any" value="1" required>
                        <input aria-label="Coeficiente y de ecuación 3" id="b3" type="number" step="any" value="-1" required>
                        <input aria-label="Coeficiente z de ecuación 3" id="c3" type="number" step="any" value="1" required>
                        <input aria-label="Resultado de ecuación 3" id="d3" type="number" step="any" value="2" required>
                    </div>
                </div>

                <button class="boton" type="submit">Resolver sistema</button>
            </form>

            <div id="resultado" class="resultado" aria-live="polite"></div>
            <a class="boton" href="ecuaciones3x3.html">Volver a la explicación</a>
        </section>
    </main>

    <footer class="pie"><p>Proyectofila2</p></footer>

    <script>
        const formulario = document.getElementById("formulario");
        const resultado = document.getElementById("resultado");

        formulario.addEventListener("submit", function(evento) {
            evento.preventDefault();

            const A = [
                [Number(a1.value), Number(b1.value), Number(c1.value), Number(d1.value)],
                [Number(a2.value), Number(b2.value), Number(c2.value), Number(d2.value)],
                [Number(a3.value), Number(b3.value), Number(c3.value), Number(d3.value)]
            ];

            resultado.style.display = "block";
            const pasos = [];

            for (let columna = 0; columna < 3; columna++) {
                let pivote = columna;

                for (let fila = columna + 1; fila < 3; fila++) {
                    if (Math.abs(A[fila][columna]) > Math.abs(A[pivote][columna])) {
                        pivote = fila;
                    }
                }

                if (Math.abs(A[pivote][columna]) < 1e-10) {
                    resultado.innerHTML =
                        "<h3>Resultado</h3><p>El sistema no tiene una solución única. Puede ser incompatible o tener infinitas soluciones.</p>";
                    return;
                }

                if (pivote !== columna) {
                    [A[columna], A[pivote]] = [A[pivote], A[columna]];
                    pasos.push(`Se intercambiaron las filas ${columna + 1} y ${pivote + 1}.`);
                }

                const divisor = A[columna][columna];

                for (let j = columna; j < 4; j++) {
                    A[columna][j] /= divisor;
                }

                for (let fila = columna + 1; fila < 3; fila++) {
                    const factor = A[fila][columna];

                    for (let j = columna; j < 4; j++) {
                        A[fila][j] -= factor * A[columna][j];
                    }
                }

                pasos.push(`Se eliminó la incógnita de la columna ${columna + 1}.`);
            }

            const z = A[2][3] / A[2][2];
            const y = (A[1][3] - A[1][2] * z) / A[1][1];
            const x = (A[0][3] - A[0][1] * y - A[0][2] * z) / A[0][0];

            resultado.innerHTML = `
                <h3>Solución del sistema</h3>
                <p>x = ${x.toFixed(4)}</p>
                <p>y = ${y.toFixed(4)}</p>
                <p>z = ${z.toFixed(4)}</p>
                <h3>Pasos realizados</h3>
                <ol class="lista">
                    ${pasos.map(paso => `<li>${paso}</li>`).join("")}
                </ol>
            `;
        });
    </script>
</body>
</html>
